<section class="min-h-screen bg-stone-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <header class="mb-8">
      <h1 class="text-2xl font-bold text-renova-primaria sm:text-3xl">
        Catálogo
      </h1>

      <p class="mt-2 text-sm text-slate-600 sm:text-base">
        Confira as peças únicas disponíveis em nosso bazar.
      </p>
    </header>

    @if (products.length > 0) {
      <div
        class="grid grid-cols-1 gap-5
               min-grid-cols-2
               md:grid-cols-3
               xl:grid-cols-4"
      >
        @for (product of products; track product.productId) {
          <app-product-card
            [product]="product"
            (addToCart)="onAddToCart($event)"
          />
        }
      </div>
    } @else {
      <div
        class="rounded-2xl border border-dashed border-slate-300
               bg-white px-6 py-16 text-center"
      >
        <i
          class="fa-solid fa-shirt text-4xl text-slate-300"
          aria-hidden="true"
        ></i>

        <h2 class="mt-4 text-lg font-bold text-slate-800">
          Nenhuma peça encontrada
        </h2>

        <p class="mt-2 text-sm text-slate-500">
          Novas peças serão adicionadas em breve.
        </p>
      </div>
    }
  </div>
</section>
