<main class="min-h-screen w-full flex flex-col justify-center items-center bg-renova-bg-primario bg-[url('/fundo-login.png')] bg-cover bg-center bg-no-repeat px-4 py-8 relative">

    <div class="flex flex-col items-center mb-8 text-center z-10">
        <img src="/logo-renova.png" alt="Logo Renova Bazar" class="h-20 mb-2">
        <h1 class="text-renova-primaria font-bold text-2xl tracking-widest uppercase">Renova Bazar</h1>
        <p class="text-gray-500 text-[10px] sm:text-xs tracking-widest uppercase mt-1">Bazar Beneficente • Moda Sustentável</p>
    </div>

    <form (ngSubmit)="login()" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-10 flex flex-col gap-6 z-10">
        
        <div class="text-center mb-2">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Faça seu login</h2>
            <p class="text-gray-500 text-sm">Acesse sua conta para continuar.</p>
        </div>

        <div *ngIf="errorMessage()" class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded text-sm text-center">
            {{ errorMessage() }}
        </div>

        <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-semibold text-gray-700">Email</label>
            <div class="flex items-center border border-gray-300 rounded-lg px-3 py-2.5 transition-colors focus-within:border-renova-primaria focus-within:ring-1 focus-within:ring-renova-primaria">
                <i class="fa-regular fa-envelope text-gray-400 w-6 text-center"></i>
                <div class="h-5 w-px bg-gray-300 mx-2"></div>
                <input type="email" id="email" name="email" [(ngModel)]="loginData.email" placeholder="seu@email.com" class="w-full bg-transparent outline-none text-gray-700 placeholder-gray-400 text-sm">
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <label for="password" class="text-sm font-semibold text-gray-700">Senha</label>
            <div class="flex items-center border border-gray-300 rounded-lg px-3 py-2.5 transition-colors focus-within:border-renova-primaria focus-within:ring-1 focus-within:ring-renova-primaria">
                <i class="fa-solid fa-lock text-gray-400 w-6 text-center"></i>
                <div class="h-5 w-px bg-gray-300 mx-2"></div>
                <input type="password" id="password" name="password" [(ngModel)]="loginData.password" placeholder="Sua senha" class="w-full bg-transparent outline-none text-gray-700 placeholder-gray-400 text-sm">
                <button type="button" class="text-gray-400 hover:text-gray-600 focus:outline-none ml-2 cursor-pointer">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-col gap-3 mt-4">
            
            <app-button
                type="submit"
                [disabled]="isLoading()"
                [text]="isLoading() ? 'Aguarde...' : 'Entrar'"
                [icon]="isLoading() ? '' : 'fa-solid fa-arrow-right'"
                btnClass="bg-renova-primaria cursor-pointer text-white rounded-lg py-3 text-sm hover:bg-opacity-90 disabled:bg-gray-400 shadow-md">
            </app-button>
            
            <app-button
                type="button"
                text="Cadastre-se aqui"
                icon="fa-regular fa-user"
                btnClass="bg-white border cursor-pointer border-renova-primaria text-renova-primaria rounded-lg py-3 text-sm hover:bg-gray-50"
                (onClick)="navigateToSignUp()">
            </app-button>
        </div>
    </form>

    <div class="mt-8 text-center text-gray-500 text-xs sm:text-sm z-10">
        <p class="italic">"Cada um contribua segundo propôs no seu coração."</p>
        <p class="font-bold mt-1">2 Coríntios 9:7</p>
    </div>

</main>
