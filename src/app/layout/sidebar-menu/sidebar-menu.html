<aside class="fixed bottom-0 left-0 top-0 z-30 flex min-h-screen w-64 flex-col justify-between border-r border-slate-200 bg-stone-50 p-6">
  
  <div class="flex flex-col gap-6">
    <nav class="mt-2 flex flex-col gap-1.5">
      @for (item of menuItems; track item.label) {
        @if (hasPermission(item)) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-renova-primaria text-white shadow-sm font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 cursor-pointer"
          >
            <i [class]="item.icon + ' text-base w-5 text-center'"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>
  </div>

  <div class="flex flex-col gap-6 border-t border-slate-100 pt-4">
    <button
      type="button"
      (click)="logout()"
      class="flex w-full items-center gap-3 rounded-xl px-4 py-2 text-left text-sm font-semibold text-red-600 transition-colors hover:bg-red-50 cursor-pointer"
    >
      <i class="fa-solid fa-arrow-right-from-bracket text-base w-5 text-center"></i>
      <span>Sair / Logout</span>
    </button>

    <div class="text-[11px] leading-relaxed text-slate-400">
      <p class="italic">"Cada um contribua segundo propôs no seu coração."</p>
    </div>
  </div>

</aside>
