<article
  class="group flex h-full w-full flex-col overflow-hidden rounded-2xl
         border border-slate-200 bg-white shadow-sm
         transition-all duration-300
         hover:-translate-y-1 hover:shadow-lg"
>
  <!-- Imagem do produto -->
  <div class="relative aspect-[4/5] w-full overflow-hidden bg-slate-100">
    @if (!imageHasError && product.imageUrl) {
      <img
        [ngSrc]="product.imageUrl"
        [alt]="product.productName"
        fill
        sizes="(max-width: 639px) 100vw,
               (max-width: 1023px) 50vw,
               (max-width: 1279px) 33vw,
               25vw"
        class="object-cover transition-transform duration-500
               group-hover:scale-105"
        (error)="onImageError()"
      />
    } @else {
      <div
        class="flex h-full w-full flex-col items-center justify-center
               gap-3 bg-slate-100 px-4 text-center text-slate-400"
      >
        <i
          class="fa-regular fa-image text-4xl"
          aria-hidden="true"
        ></i>

        <span class="text-sm font-medium">
          Imagem indisponível
        </span>
      </div>
    }

    <!-- Status do produto -->
    @if (!isAvailable) {
      <span
        class="absolute left-3 top-3 rounded-full bg-white/95
               px-3 py-1.5 text-xs font-bold uppercase tracking-wide
               text-slate-700 shadow-sm"
      >
        {{ product.status === 'RESERVED' ? 'Reservada' : 'Vendida' }}
      </span>
    }
  </div>

  <!-- Informações do produto -->
  <div class="flex flex-1 flex-col p-4 sm:p-5">
    <div class="flex-1">
      <h2
        class="line-clamp-2 text-base font-bold leading-snug
               text-slate-900 sm:text-lg"
        [title]="product.productName"
      >
        {{ product.productName }}
      </h2>

      <p class="mt-1 text-sm font-medium text-slate-500">
        {{ product.category }}
      </p>

      <p
        class="mt-3 text-xl font-bold text-renova-primaria sm:text-2xl"
      >
        {{ product.price | currency:'BRL':'symbol':'1.2-2' }}
      </p>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <span class="text-sm font-medium text-slate-600">
          Tamanho:
        </span>

        <span
          class="inline-flex min-w-10 items-center justify-center
                 rounded-lg bg-slate-100 px-3 py-1.5
                 text-sm font-bold text-slate-800"
        >
          {{ product.size }}
        </span>
      </div>
    </div>

    <div class="mt-5 h-12 w-full">
      <app-button
        [text]="buttonText"
        [icon]="buttonIcon"
        [disabled]="!isAvailable"
        [btnClass]="buttonClass"
        (onClick)="onAddToCart()"
      />
    </div>
  </div>
</article>
