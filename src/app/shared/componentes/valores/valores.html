<section class="flex flex-col gap-4 justify-center items-center text-center">
    <div class="w-20 h-20 rounded-full bg-renova-bg-primario text-white flex items-center justify-center shadow-sm">
        <i *ngIf="icone" [ngClass]="icone" class="text-3xl text-renova-primaria "></i>

        
    </div>
    <div class="flex flex-col">
        <h4 [ngClass]="titulo" class="text-renova-primaria font-semibold"></h4>
        <p [ngClass]="legenda" class="text-gray-600 font-light"></p>
    </div>
</section>
